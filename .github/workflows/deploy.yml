name: Deploy Admin Backend to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Image, Push to ECR & Deploy via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_ADMIN_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Private EC2 via AWS SSM Run Command
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_ADMIN_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
          RAW_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID_ADMIN_PORTAL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # App secrets
          ADMIN_PORT: 4001
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIN_BACKEND_URL: ${{ secrets.MAIN_BACKEND_INTERNAL_URL }}
        run: |
          # Sanitize instance ID: strip quotes, brackets, and whitespace
          INSTANCE_ID=$(echo "$RAW_INSTANCE_ID" | tr -d ' "[]'\''\r\n')
          echo "Targeting Instance: $INSTANCE_ID"
          COMMANDS=$(cat <<EOF
          export PATH=\$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker stop dairy-admin-backend 2>/dev/null || true
          docker rm dairy-admin-backend 2>/dev/null || true
          docker run -d \
            --name dairy-admin-backend \
            --restart unless-stopped \
            -p 4001:4001 \
            -e NODE_ENV=production \
            -e ADMIN_PORT=$ADMIN_PORT \
            -e DATABASE_URL="$DATABASE_URL" \
            -e MAIN_BACKEND_URL="$MAIN_BACKEND_URL" \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker image prune -af --filter "until=24h"
          EOF
          )

          RAW_COMMAND_JSON=$(jq -n --arg cmd "$COMMANDS" '[$cmd]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$RAW_COMMAND_JSON" \
            --comment "Deploying dairy-admin-backend commit $IMAGE_TAG" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command sent with ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          set -e

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json)

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          STDOUT=$(echo "$INVOCATION" | jq -r '.StandardOutputContent')
          STDERR=$(echo "$INVOCATION" | jq -r '.StandardErrorContent')

          echo "=== EC2 Execution Output ==="
          echo "$STDOUT"
          echo "=== EC2 Execution Errors ==="
          echo "$STDERR"

          echo "Deployment finished with status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

